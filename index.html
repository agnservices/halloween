<script src="common.js?v=20261003g"></script>
<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const f = $('f'), gBox = $('guestsBox'), g = $('guests');
  let busy = false;
  const status = () => (f.querySelector('input[name=status]:checked') || {}).value;
  function syncGuests(){ gBox.classList.toggle('hidden', status() !== 'yes'); }
  f.querySelectorAll('input[name=status]').forEach(r => r.addEventListener('change', () => { syncGuests(); $('e-status').textContent=''; }));
  const clampG = (v) => Math.max(1, Math.min(20, parseInt(String(v).replace(/\D/g,''),10) || 1));
  $('minus').onclick = () => { g.value = clampG(g.value) - 1 || 1; g.value = clampG(g.value); };
  $('plus').onclick = () => { g.value = clampG(+clampG(g.value) + 1); };
  g.addEventListener('blur', () => g.value = clampG(g.value));
  $('name').addEventListener('input', () => { $('name').classList.remove('invalid'); $('e-name').textContent=''; });

  function showThanks(d){
    const first = (d.name || '').trim().split(/\s+/)[0];
    const T = {
      yes:  ['💀', `נתראה בצד השני, ${first}!`, d.guests > 1 ? `שמרנו מקום ל-${d.guests} נשמות אבודות (קרוב לבר, כמובן). תגיעו מחופשים — אנחנו נדאג לכל השאר.` : 'שמרנו לך מקום (קרוב לבר, כמובן). תגיעו מחופשים — אנחנו נדאג לכל השאר.'],
      maybe:['🕯️', `נשאיר לך נר דולק, ${first}`, 'אולי זה לא כן, אבל זה גם לא לא. כשתחליטו — פשוט פתחו שוב את הקישור ועדכנו.'],
      no:   ['⚰️', `נתגעגע, ${first}`, 'חבל! נרים כוסית לכבודך מעבר לקבר. אם תתחרט/י — הקישור הזה תמיד פתוח.']
    }[d.status];
    $('tIcon').textContent = T[0]; $('tTitle').textContent = T[1]; $('tBody').textContent = T[2];
    f.classList.add('hidden'); $('thanks').classList.remove('hidden');
    $('rsvp').scrollIntoView({behavior:'smooth', block:'start'});
  }
  $('again').onclick = () => { $('thanks').classList.add('hidden'); f.classList.remove('hidden'); $('btnText').textContent = 'עדכון תשובה 💀'; };

  // prefill if this device already answered
  try { const m = JSON.parse(localStorage.getItem('hw26_rsvp')||'null'); if (m && m.data) { const d=m.data;
    $('name').value=d.name||''; g.value=d.guests||1;
    const r=$('s-'+d.status); if(r) r.checked=true; syncGuests(); $('btnText').textContent='עדכון תשובה 💀'; } } catch(e){}

  f.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    if (busy) return;
    ['name','status','guests','form'].forEach(k => $('e-'+k).textContent='');
    const name = $('name').value.trim().replace(/\s+/g,' ');
    const st = status();
    let ok = true;
    if (name.length < 2) { $('e-name').textContent = 'צריך שם כדי שנדע את מי להפחיד 👻'; $('name').classList.add('invalid'); ok=false; }
    if (!st) { $('e-status').textContent = 'נו, מגיעים או לא?'; ok=false; }
    if (!ok) { const e = document.querySelector('.err:not(:empty)'); e && e.parentElement.scrollIntoView({behavior:'smooth',block:'center'}); return; }
    const d = {name, status: st, guests: st === 'yes' ? clampG(g.value) : 0, at: new Date().toISOString(), ua: navigator.userAgent.slice(0,80)};
    busy = true; const btn = $('submit'); btn.disabled = true; btn.classList.add('loading'); const old = $('btnText').textContent; $('btnText').textContent = 'שולחים לעולם הבא...';
    try { await RSVP.save(d); showThanks(d); $('btnText').textContent = 'עדכון תשובה 💀'; }
    catch (e) { console.error(e); $('e-form').textContent = 'אופס, הרוחות שיבשו את השליחה. נסו שוב בעוד רגע.'; $('btnText').textContent = old; }
    finally { busy = false; btn.disabled = false; btn.classList.remove('loading'); }
  });
})();
</script>

  }
