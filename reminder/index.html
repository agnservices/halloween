<style>
:root{--gold:#d8b77a;--gold2:#f3dfb2;--line:rgba(216,183,122,.55)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#050403}
body{margin:0;color:var(--gold2);font-family:'Heebo',sans-serif;min-height:100svh;overflow-x:hidden}

.shade{position:fixed;inset:0;z-index:1;pointer-events:none;

main{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
.spacer{height:57svh}
.card{position:relative;border:1px solid var(--line);padding:16px 10px 10px;margin-top:14px;background:rgba(8,6,5,.42);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  box-shadow:0 0 40px rgba(0,0,0,.8),inset 0 0 0 4px rgba(5,4,3,.6),inset 0 0 0 5px rgba(216,183,122,.22);text-align:center}
.card:before,.card:after,.card .c1,.card .c2{content:"";position:absolute;width:26px;height:26px;border:2px solid var(--gold);pointer-events:none}
.card:before{top:-5px;right:-5px;border-left:0;border-bottom:0}.card:after{top:-5px;left:-5px;border-right:0;border-bottom:0}
.card .c1{bottom:-5px;right:-5px;border-left:0;border-top:0}.card .c2{bottom:-5px;left:-5px;border-right:0;border-top:0}
.goldtext{background:linear-gradient(180deg,#fff1cf 0%,#e2c088 45%,#a88247 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:21px;margin:0 0 2px;line-height:1.15}
.ribbon{position:absolute;top:0;left:50%;transform:translate(-50%,-55%);white-space:nowrap;background:linear-gradient(180deg,#f0d9a6,#b58f52);color:#1a1209;font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:17px;padding:5px 16px;border-radius:999px;border:1px solid #fff1cf;box-shadow:0 4px 18px rgba(0,0,0,.6),0 0 14px rgba(216,183,122,.35)}
h1 .e{color:initial;-webkit-text-fill-color:initial}
.when{font-family:'Cinzel',serif;font-size:14px;letter-spacing:.08em;margin:0 0 8px;color:var(--gold2)}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;direction:ltr}
.cd div{border:1px solid var(--line);border-radius:4px;padding:6px 2px 5px;background:linear-gradient(180deg,rgba(216,183,122,.16),rgba(0,0,0,.45))}
.cd b{display:block;font-family:'Cinzel',serif;font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.cd span{display:block;font-size:11px;color:#cfb383;margin-top:3px;direction:rtl}
.started{display:none;font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:26px;padding:6px 0}
.done .cd{display:none}.done .started{display:block}
.orn{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--gold);margin:7px 0 4px;font-size:11px}
.orn:before,.orn:after{content:"";height:1px;flex:1;max-width:100px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn:after{background:linear-gradient(270deg,transparent,var(--gold))}
.addr{font-size:15px;margin:0 0 2px}
.tag{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.12em;margin:2px 0;color:var(--gold2)}
.costume{font-family:'Frank Ruhl Libre',serif;font-size:18px;margin:2px 0 0}
.btns{display:grid;gap:7px;margin-top:9px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
a.b{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:8px 6px;font-size:14px;color:var(--gold2);background:rgba(0,0,0,.5)}
a.b.main{border-color:var(--gold2);background:linear-gradient(180deg,#e9cf98,#b58f52);color:#1a1209;font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:17px;padding:10px 6px;box-shadow:0 6px 24px rgba(216,183,122,.25)}
a.b{padding:11px 6px;font-size:15px}
.rl{display:block;text-align:center;font-size:12.5px;color:#b89b6c;text-decoration:underline;text-underline-offset:3px;margin-top:2px;padding:4px}
.foot{text-align:center;color:#8d7550;font-size:12px;margin-top:10px;font-family:'Cinzel',serif;letter-spacing:.2em}
.flick{animation:fl 3s infinite}@keyframes fl{0%,100%{opacity:1}50%{opacity:.6}}

<body>

<main>

        <a class="b" id="calBtn" href="https://agnservices.github.io/halloween/halloween-party.ics" data-gcal="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=HALLOWEEN%20PARTY%20%F0%9F%92%80&amp;dates=20261030T180000Z%2F20261030T230000Z&amp;ctz=Asia%2FJerusalem&amp;location=%D7%91%D7%99%D7%AA%20%D7%94%D7%A2%D7%9D%2012%2C%20%D7%A8%D7%9E%D7%95%D7%AA%20%D7%94%D7%A9%D7%91%D7%99%D7%9D&amp;details=DJ%2C%20FOOD%20%26%20WAY%20TOO%20MANY%20DRINKS.%0A%D7%AA%D7%92%D7%99%D7%A2%D7%95%20%D7%9E%D7%97%D7%95%D7%A4%D7%A9%D7%99%D7%9D.%20%D7%90%D7%A0%D7%97%D7%A0%D7%95%20%D7%A0%D7%93%D7%90%D7%92%20%D7%9C%D7%9B%D7%9C%20%D7%94%D7%A9%D7%90%D7%A8.%0A%D7%90%D7%99%D7%A9%D7%95%D7%A8%20%D7%94%D7%92%D7%A2%D7%94%3A%20https%3A%2F%2Fagnservices.github.io%2Fhalloween%2F">🗓️ הוספה ליומן</a>

    </div>
  </section>

</main>
<script>
(function(){
  var T=Date.parse('2026-10-30T18:00:00Z'),card=document.getElementById('card');
  var el={d:document.getElementById('d'),h:document.getElementById('h'),m:document.getElementById('m'),s:document.getElementById('s')};
  function p(n){return n<10?'0'+n:''+n}
  function tick(){
    var ms=T-Date.now();
    if(ms<=0){card.classList.add('done');return false}
    var t=Math.floor(ms/1000);
    el.d.textContent=Math.floor(t/86400);el.h.textContent=p(Math.floor(t%86400/3600));
    el.m.textContent=p(Math.floor(t%3600/60));el.s.textContent=p(t%60);return true;
  }
  if(tick()){var iv=setInterval(function(){if(!tick())clearInterval(iv)},1000)}
  var a=document.getElementById('calBtn');
  if(/Android/i.test(navigator.userAgent)){a.href=a.getAttribute('data-gcal')}
  var v=document.getElementById('v');
  function play(){var pr=v.play();if(pr&&pr.catch)pr.catch(function(){})}
  v.muted=true;play();
  ['touchstart','click','scroll'].forEach(function(e){window.addEventListener(e,function f(){if(v.paused)play();window.removeEventListener(e,f)},{passive:true})});
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&v.paused)play()});
})();
</script>
